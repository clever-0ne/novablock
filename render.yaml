# Render blueprint — NovaBlock.io
# Deploy: New → Blueprint → point at this repo. Or New → Web Service and use
# these exact settings manually.
#
# Secrets (set in the Render dashboard, NOT here): ADMIN_PASS, KYC_URL_SECRET,
# SMTP_PASS, SITE_URL, APP_ORIGIN.

services:
  - type: web
    name: novablock
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
